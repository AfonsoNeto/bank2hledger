[package]
name = "bank2hledger"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Import bank transaction exports (CSV/XLS/PDF) and API fetchers into your hledger journal with dedup, categorization rules, and a review-before-approve workflow."
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["hledger", "ledger", "plaintext-accounting", "banking", "finance"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
calamine = { version = "0.36", features = ["chrono"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.3"
dirs = "5.0"
getrandom = "0.2"
regex = "1.10"
rust_decimal = { version = "1.36", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Fetcher support (network + secret storage). Disabled with --no-default-features.
keyring = { version = "3", features = ["sync-secret-service", "windows-native", "apple-native"], optional = true }
open = { version = "5", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
rpassword = { version = "7", optional = true }
dialoguer = { version = "0.11", optional = true }

[features]
default = ["fetch", "interactive"]
fetch = ["dep:keyring", "dep:open", "dep:reqwest", "dep:rpassword"]
interactive = ["dep:dialoguer"]

[dev-dependencies]
tempfile = "3"
