name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - name: Install hledger, poppler, and Tauri Linux dependencies
        # The clippy step covers the GUI crate, whose gio-sys/glib-sys build
        # scripts need the same system libraries the gui job installs.
        run: |
          sudo apt-get update && sudo apt-get install -y \
            hledger poppler-utils \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf
      - name: Format
        run: cargo fmt --check
      - name: Clippy (core + GUI)
        run: cargo clippy -p bank2hledger -p bank2hledger-gui --all-targets -- -D warnings
      - name: Tests (with fetchers)
        run: cargo test -p bank2hledger
      - name: Offline core builds without network code
        run: cargo build -p bank2hledger --no-default-features
      - name: No-telemetry smoke check
        run: |
          # The binaries must not link any telemetry-ish crates: assert none in the
          # trees (core offline build and the GUI's full dependency tree).
          cargo tree --no-default-features | grep -iE "sentry|analytics|mixpanel|posthog|amplitude" && exit 1 || true
          cargo tree -p bank2hledger-gui | grep -iE "sentry|analytics|mixpanel|posthog|amplitude" && exit 1 || true

  test-windows:
    # Windows is build- and test-verified; the GUI ships only for Windows,
    # so exercise the core there too (path handling, keyring-free code).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Tests (hledger-dependent tests self-skip when absent)
        run: cargo test -p bank2hledger
      - name: Clippy
        run: cargo clippy -p bank2hledger --all-targets -- -D warnings

  gui:
    # Compile the Tauri GUI (frontend build + cargo check) on Linux with the
    # WebView2-equivalent system libs; bundling happens in the release workflow.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf
      - name: Build frontend
        working-directory: crates/bank2hledger-gui
        run: |
          npm ci
          npm run build
      - name: Clippy GUI
        run: cargo clippy -p bank2hledger-gui --all-targets -- -D warnings
