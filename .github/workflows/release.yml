name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.target }}
      - name: Build CLI
        run: cargo build --release --target ${{ matrix.target }} -p bank2hledger
      - name: Package
        shell: bash
        run: |
          dir="bank2hledger-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/bank2hledger"* "$dir"/ 2>/dev/null || true
          rm -f "$dir"/bank2hledger-gui*
          cp README.md LICENSE "$dir"/
          tar czf "$dir.tar.gz" "$dir"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: "*.tar.gz"

  gui-windows:
    # Windows GUI: NSIS installer, MSI, portable zip, and MSIX package.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
      - name: Build and bundle (NSIS + MSI)
        working-directory: crates/bank2hledger-gui
        run: |
          npm ci
          npm run tauri build -- --bundles nsis,msi
      - name: Portable zip
        shell: pwsh
        run: |
          $dir = "bank2hledger-gui-${{ github.ref_name }}-portable"
          New-Item -ItemType Directory "$dir"
          Copy-Item "target/release/bank2hledger-gui.exe" "$dir/"
          Copy-Item README.md, LICENSE "$dir/"
          Compress-Archive -Path "$dir" -DestinationPath "$dir.zip"
      - name: MSIX package (unsigned)
        shell: pwsh
        run: |
          $sdk = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "makeappx.exe" -Recurse |
            Where-Object { $_.FullName -match "x64" } | Select-Object -First 1
          $layout = "msix-layout"
          New-Item -ItemType Directory "$layout/Assets" -Force
          Copy-Item "target/release/bank2hledger-gui.exe" "$layout/"
          Copy-Item "crates/bank2hledger-gui/msix/AppxManifest.xml" "$layout/"
          Copy-Item "crates/bank2hledger-gui/msix/Assets/*" "$layout/Assets/"
          & $sdk.FullName pack /d $layout /p "bank2hledger-gui-${{ github.ref_name }}.msix"
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            bank2hledger-gui-*-portable.zip
            bank2hledger-gui-*.msix

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish -p bank2hledger || echo "already published"
